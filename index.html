<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CONTATO RUMB - PLANTÃO</title>
    <style>
        /* MANTENDO SEU ESTILO ORIGINAL */
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f0f0f0;
            gap: 20px;
            margin: 0;
            padding-bottom: 50px;
            font-family: Arial, sans-serif;
        }

        header {
            background-color: #00a4e4;
            color: white;
            padding: 1rem;
            text-align: center;
            display: flex;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            align-items: center;
            gap: 10px;
            width: 100%;
            justify-content: center;
        }

        .card {
            width: 400px;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            background-color: #fff;
            text-align: center;
        }

        /* DESTAQUE PARA O CARD DE PLANTÃO */
        .card-plantao {
            border: 3px solid #00a4e4;
            position: relative;
            background-color: #e3f2fd;
        }
        .badge-plantao {
            background: #d32f2f;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
        }

        .profile-pic {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background-color: #ddd;
            margin: 0 auto 15px auto;
            overflow: hidden;
            border: 3px solid #00205b;
        }
        .profile-pic img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        h2 { margin: 0; font-size: 24px; color: #333; }
        strong { color: #00205b; }
        .contact-info { margin-top: 10px; font-size: 18px; color: #666; }
        .sap__cor__verde { color: #075e54; font-weight: bold; }

        .social-links { margin-top: 20px; display: flex; flex-direction: column; gap: 10px; }
        .apresentacao__links__link {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 600;
            padding: 15px;
            text-decoration: none;
            color: #333;
        }
        .apresentacao__links__link img { width: 24px; }
        .caveira { width: 60px; }
        .whats { position: fixed; bottom: 20px; right: 20px; z-index: 9999; }
        
        #lista-contatos { display: flex; flex-direction: column; gap: 20px; align-items: center; }
    </style>

    <script>
        document.oncontextmenu = function() { return false; };
        document.onkeydown = function(e) {
            if(event.keyCode == 123 || (e.ctrlKey && e.shiftKey && (e.keyCode == 73 || e.keyCode == 74)) || (e.ctrlKey && e.keyCode == 85)) return false;
        };
    </script>
</head>
<body>

    <header>
        <img src="img/caveira-armada2.png" class="caveira">
        <div style="color:white; font-weight:bold;">CONTATOS da RUMB - 3ª CIA - UPP PAVÃO</div>
    </header>

    <div id="plantao-atual">
        </div>

    <hr style="width: 80%; border: 1px solid #ccc; margin: 20px 0;">
    <h3 style="color: #666;">Todos os Contatos</h3>

    <div id="lista-contatos">
        </div>

    <div class="whats">
        <a href="https://wa.me/5521964827877" target="_blank">
            <img src="img/whatsapp.png" width="70px" alt="Whatsapp">
        </a>
    </div>

    <script>
        // Dados dos Policiais (Centralizado para facilitar manutenção)
        const policiais = {
            triumpho: { nome: "Triumpho", posto: "SD PM", cel: "(21) 96484-4022", linkWa: "5521964844022", foto: "img/triumpho.png" },
            simoes: { nome: "R. Simões", posto: "3º SGT PM", cel: "(21) 98253-9175", linkWa: "5521982539175", foto: "img/rodrigo.png" },
            dan: { nome: "Dan", posto: "3º SGT PM", cel: "(21) 96482-7877", linkWa: "5521964827877", foto: "img/dan.png" },
            lacerda: { nome: "Lacerda", posto: "3º SGT PM", cel: "(21) 96418-6198", linkWa: "5521964186198", foto: "img/lacerda.png" },
            alacrino: { nome: "Alacrino", posto: "3º SGT PM", cel: "(21) 97393-5903", linkWa: "5521973935903", foto: "img/alacrino.png" },
            pinheiro: { nome: "Pinheiro", posto: "CB PM", cel: "(21) 99347-1036", linkWa: "5521993471036", foto: "img/pinheiro.png" },
            };

        // Ordem da Escala conforme seu exemplo (cada item dura 12h)
        const escala = [
            policiais.triumpho, // 26/01 17h (Noite)
            policiais.simoes,   // 27/01 05h (Dia)
            policiais.dan,      // 27/01 17h (Noite)
            policiais.lacerda,  // 28/01 05h (Dia)
            policiais.simoes,   // 28/01 17h (Noite)
            policiais.alacrino, // 29/01 05h (Dia)
            policiais.lacerda,  // 29/01 17h (Noite)
            policiais.triumpho, // 30/01 05h (Dia)
            policiais.alacrino  // 30/01 17h (Noite)
        ];

        function gerarHTMLCard(p, isPlantao = false) {
            return `
                <div class="card ${isPlantao ? 'card-plantao' : ''}">
                    ${isPlantao ? '<div class="badge-plantao">EM SERVIÇO AGORA</div>' : ''}
                    <div class="profile-pic">
                        <img src="${p.foto}" alt="Foto ${p.nome}">
                    </div>
                    <h2>${p.posto} <strong>${p.nome}</strong></h2>
                    <div class="contact-info">
                        <p>Cel.: ${p.cel}</p>
                        <a href="https://wa.me/${p.linkWa}" class="a">
                            <p class="sap__cor__verde">WhatsApp ${p.cel}</p>
                        </a>
                    </div>
                    <div class="social-links">
                        <a class="apresentacao__links__link" href="#"><img src="img/instagram.png">Instagram</a>
                        <a class="apresentacao__links__link" href="mailto:rumb2upp19bpm@outlook.com"><img src="img/carta.png">E-mail RUMB</a>
                    </div>
                </div>
            `;
        }

        function atualizarPagina() {
            const agora = new Date();
            // Data de referência: 26 de Janeiro de 2026 às 17:00
            const dataInicio = new Date(2026, 0, 26, 17, 0, 0);
            
            // Calcula quantas janelas de 12 horas se passaram
            const diffMs = agora - dataInicio;
            const diff12h = Math.floor(diffMs / (12 * 60 * 60 * 1000));

            // Define o policial de plantão
            let plantonista;
            if (diff12h < 0) {
                plantonista = escala[0]; // Antes do início da escala, mostra o primeiro
            } else {
                plantonista = escala[diff12h % escala.length];
            }

            // Renderiza o card de plantão
            document.getElementById('plantao-atual').innerHTML = gerarHTMLCard(plantonista, true);

            // Renderiza a lista completa (excluindo quem já está no plantão para não repetir no topo)
            const listaDiv = document.getElementById('lista-contatos');
            listaDiv.innerHTML = "";
            Object.values(policiais).forEach(p => {
                listaDiv.innerHTML += gerarHTMLCard(p);
            });
        }

        atualizarPagina();
        // Atualiza a cada 1 minuto para checar virada de turno
        setInterval(atualizarPagina, 60000);
    </script>
</body>
</html>
